<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | Finish Well</title>
<script>
/* GitHub Pages serves this file for any missing path. If the address is a
   real page with a trailing slash (e.g. /index.state-b.html/), send the
   visitor to the same address without the slash, keeping query and hash. */
(function (l) {
  if (/\.html\/+$/.test(l.pathname)) {
    l.replace(l.pathname.replace(/\/+$/, '') + l.search + l.hash);
  }
})(window.location);
</script>
<style>
  body{margin:0;background:#F7FAFA;color:#1B1E1E;font-family:'EB Garamond',Georgia,serif;font-size:19px;line-height:1.6}
  main{max-width:560px;margin:0 auto;padding:96px 24px}
  h1{font-size:32px;margin:0 0 12px;color:#12363E}
  a{color:#12363E}
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>That address does not exist. <a href="/">Go to the Finish Well home page</a>.</p>
</main>
</body>
</html>
